<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002147">
<title>Dispatch — Email, thoughtfully delivered</title>
<style>
:root{--navy:#002147;--paper:#F8FAF9;--white:#fff;--ink:#15263a;--muted:#718096;--line:#e5eaf0;--blue:#eaf1f8;--shadow:0 12px 40px #00214712}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 360px minmax(380px,1fr);grid-template-rows:68px 1fr}.top{grid-column:1/-1;background:var(--navy);color:white;display:flex;align-items:center;padding:0 24px;gap:24px}.brand{font-weight:800;font-size:22px;letter-spacing:-.7px;display:flex;align-items:center;gap:10px;min-width:200px}.mark{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}.search{max-width:650px;flex:1;position:relative}.search input{width:100%;padding:11px 14px 11px 40px;border:0;border-radius:9px;background:#ffffff1b;color:white;outline:none}.search input::placeholder{color:#d6e0eb}.search span{position:absolute;left:14px;top:9px;font-size:17px}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.iconbtn{border:0;background:transparent;color:inherit;border-radius:8px;padding:9px;font-size:17px}.iconbtn:hover{background:#ffffff20}.avatar{width:34px;height:34px;border-radius:50%;background:#d8e5f1;color:var(--navy);display:grid;place-items:center;font-weight:700}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px}.compose{width:100%;background:var(--navy);color:white;border:0;border-radius:9px;padding:13px 16px;font-weight:700;box-shadow:var(--shadow);margin-bottom:22px}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#9aa6b4;padding:0 12px 9px}.navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#435267;cursor:pointer;margin:2px 0}.navitem:hover,.navitem.active{background:var(--blue);color:var(--navy);font-weight:700}.navitem .ico{width:20px;text-align:center;font-size:16px}.count{margin-left:auto;color:#718096;font-size:12px}.side-bottom{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}.account{display:flex;align-items:center;gap:10px;padding:10px 8px;color:#536174}.account .avatar{width:30px;height:30px}.list{background:#fff;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}.listhead{padding:23px 20px 15px;display:flex;align-items:center;justify-content:space-between}.listhead h2{font-size:19px;margin:0;color:var(--navy)}.listhead small{color:var(--muted)}.filters{display:flex;gap:7px;padding:0 18px 14px;border-bottom:1px solid var(--line)}.chip{border:1px solid var(--line);background:white;color:#66758a;border-radius:20px;padding:6px 11px;font-size:12px}.chip.active{background:var(--blue);border-color:#d6e2ef;color:var(--navy);font-weight:700}.emails{overflow:auto}.email{padding:16px 18px;border-bottom:1px solid #edf0f4;cursor:pointer;position:relative}.email:hover{background:#f7f9fb}.email.selected{background:#eef3f8;border-left:3px solid var(--navy);padding-left:15px}.email.unread .sender,.email.unread .subject{font-weight:800;color:#15263a}.emailtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.sender{font-weight:600;color:#46556a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#8793a2;white-space:nowrap}.subject{font-weight:600;margin-bottom:5px;color:#304156;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:12px;color:#8793a2;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.emailmeta{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:11px;color:#8793a2}.star{margin-left:auto;color:#b0bac6;font-size:17px}.star.on{color:#d49a20}.reader{min-width:0;background:var(--paper);display:flex;flex-direction:column}.empty{margin:auto;text-align:center;color:#7b8795}.empty .big{font-size:42px;margin-bottom:12px}.readerbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:8px;background:#fff}.readerbar button{border:0;background:transparent;color:#607086;padding:8px;border-radius:7px}.readerbar button:hover{background:var(--blue);color:var(--navy)}.message{padding:30px 38px;overflow:auto}.message h1{font-size:23px;color:var(--navy);margin:0 0 24px;letter-spacing:-.4px}.fromrow{display:flex;align-items:center;gap:12px;margin-bottom:26px}.fromrow .avatar{width:42px;height:42px}.fromdetails{flex:1}.fromdetails strong{display:block}.fromdetails span{font-size:12px;color:#8793a2}.bodycopy{font-size:14px;line-height:1.8;color:#425267;white-space:pre-wrap;max-width:780px}.bodycopy a{color:var(--navy)}.attachment{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:white;border-radius:8px;padding:11px 14px;margin-top:22px;color:#425267}.overlay{position:fixed;inset:0;background:#00152b55;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}.modal{background:white;border-radius:13px;width:min(720px,100%);box-shadow:0 25px 80px #00152b40;overflow:hidden}.modalhead{background:var(--navy);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700}.modalhead button{border:0;background:transparent;color:white;font-size:20px}.composefields{padding:14px 20px}.composefields input,.composefields textarea{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 2px;outline:none;color:var(--ink)}.composefields textarea{height:260px;resize:vertical;border:0;line-height:1.6}.modalfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}.send{background:var(--navy);color:white;border:0;border-radius:8px;padding:10px 22px;font-weight:700}.secondary{border:1px solid var(--line);background:white;color:#59687c;border-radius:8px;padding:9px 13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 18px;border-radius:9px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}.mobileback{display:none}
@media(max-width:1000px){.app{grid-template-columns:210px 320px minmax(300px,1fr)}.brand{min-width:160px}.message{padding:24px}}
@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:60px 1fr}.top{padding:0 14px;gap:12px}.brand{min-width:0;font-size:19px}.search{max-width:none}.top-actions .iconbtn{display:none}.sidebar{display:none}.list{grid-column:1;grid-row:2;border:0}.reader{display:none;grid-column:1;grid-row:2}.app.reading .list{display:none}.app.reading .reader{display:flex}.message{padding:22px 18px}.readerbar{padding:0 12px}.mobileback{display:inline-block!important}.listhead{padding-top:18px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand"><span class="mark">D</span>Dispatch</div><div class="search"><span>⌕</span><input id="search" placeholder="Search mail" aria-label="Search mail"></div><div class="top-actions"><button class="iconbtn" title="Help" onclick="toast('Dispatch help center coming soon')">?</button><button class="iconbtn" title="Settings" onclick="settings()">⚙</button><div class="avatar">C</div></div></header>
<aside class="sidebar"><button class="compose" onclick="openCompose()">＋ &nbsp; Compose</button><div class="nav-label">MAILBOX</div><div id="nav"></div><div class="side-bottom"><div class="nav-label">ACCOUNT</div><div class="account"><div class="avatar">C</div><div><strong style="display:block;font-size:12px">Carrington</strong><span style="font-size:11px;color:#8b97a6">Local demo account</span></div></div><div class="navitem" onclick="settings()"><span class="ico">⚙</span>Settings</div></div></aside>
<section class="list"><div class="listhead"><div><h2 id="folderTitle">Inbox</h2><small id="listCount">Your messages</small></div><button class="iconbtn" title="Refresh" onclick="render()">↻</button></div><div class="filters"><button class="chip active" data-filter="all" onclick="setFilter('all',this)">All mail</button><button class="chip" data-filter="unread" onclick="setFilter('unread',this)">Unread</button><button class="chip" data-filter="starred" onclick="setFilter('starred',this)">Starred</button></div><div class="emails" id="emails"></div></section>
<main class="reader" id="reader"><div class="empty"><div class="big">✉</div><strong style="color:#435267">Select a message to read</strong><p>Your inbox, in one calm place.</p></div></main>
</div>
<div class="overlay" id="composeOverlay"><div class="modal"><div class="modalhead"><span id="composeTitle">New message</span><button onclick="closeCompose()">×</button></div><div class="composefields"><input id="to" placeholder="To"><input id="cc" placeholder="Cc"><input id="subject" placeholder="Subject"><textarea id="body" placeholder="Write your message…"></textarea></div><div class="modalfoot"><button class="send" onclick="sendMessage()">Send&nbsp; ➤</button><button class="secondary" onclick="saveDraft()">Save draft</button><button class="secondary" onclick="closeCompose()">Discard</button><span style="margin-left:auto;color:#9aa5b2;font-size:11px">Dispatch</span></div></div></div>
<div class="toast" id="toast"></div>
<script>
const seed=[
{id:1,folder:'inbox',from:'Maya Chen',email:'maya@northstar.studio',to:'me',subject:'The proposal looks fantastic',preview:'I reviewed the latest version this morning. The direction feels right, and I have just a couple of small notes…',body:'Hi Carrington,\n\nI reviewed the latest version this morning. The direction feels right, and I have just a couple of small notes for us to discuss.\n\nCould we find 20 minutes tomorrow to walk through the timeline? I think we are very close.\n\nBest,\nMaya',time:'10:42 AM',date:'Today',unread:true,starred:true,attachment:'Project-proposal.pdf'},
{id:2,folder:'inbox',from:'Jordan Lee',email:'jordan@fieldnotes.co',to:'me',subject:'A few ideas for next week',preview:'Collected a few references and thoughts from the team. Sharing them here before our planning session…',body:'Hey,\n\nCollected a few references and thoughts from the team. Sharing them here before our planning session.\n\nI especially like the idea of keeping the first launch focused and letting the product grow from real feedback.\n\nTalk soon,\nJordan',time:'9:18 AM',date:'Today',unread:true,starred:false},
{id:3,folder:'inbox',from:'Dispatch Updates',email:'updates@dispatch.example',to:'me',subject:'Welcome to your new workspace',preview:'Your Dispatch workspace is ready. Here are a few ways to make it your own…',body:'Welcome to Dispatch!\n\nYour workspace is ready. Use the folders to stay organized, star important conversations, and compose a message whenever you need to reach someone.\n\nThis is a local demonstration inbox. Connect a mail provider to send and receive real email.',time:'Yesterday',date:'Yesterday',unread:false,starred:false},
{id:4,folder:'inbox',from:'Alex Morgan',email:'alex@studioform.com',to:'me',subject:'Re: Brand exploration',preview:'Thanks for sending these over — option B is my favorite. The contrast is really strong…',body:'Thanks for sending these over — option B is my favorite. The contrast is really strong and feels timeless. Let’s use that as our starting point.\n\nAlex',time:'Yesterday',date:'Yesterday',unread:false,starred:true},
{id:5,folder:'inbox',from:'Sam Rivera',email:'sam@brightworks.io',to:'me',subject:'Coffee next Thursday?',preview:'I will be in your area and would love to catch up if you have a little time…',body:'I will be in your area and would love to catch up if you have a little time. Let me know what your schedule looks like!\n\nSam',time:'Mon',date:'Monday',unread:false,starred:false},
{id:6,folder:'inbox',from:'Taylor Brooks',email:'taylor@madeby.taylor',to:'me',subject:'Updated files attached',preview:'Here are the updated exports in the formats we discussed. Let me know if anything else is needed…',body:'Here are the updated exports in the formats we discussed. Let me know if anything else is needed.\n\nTaylor',time:'Mon',date:'Monday',unread:false,starred:false,attachment:'Final-exports.zip'}
];
let messages=JSON.parse(localStorage.getItem('dispatch.messages')||'null')||seed;
let folder='inbox',filter='all',selected=null;
const folders=[['inbox','▣','Inbox'],['starred','☆','Starred'],['drafts','▤','Drafts'],['sent','↗','Sent'],['archive','▱','Archive'],['spam','⚑','Spam'],['trash','⌫','Trash']];
function persist(){localStorage.setItem('dispatch.messages',JSON.stringify(messages))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.getElementById('nav').innerHTML=folders.map(([id,ico,name])=>{let count=id==='inbox'?messages.filter(m=>m.folder==='inbox'&&m.unread).length:id==='drafts'?messages.filter(m=>m.folder==='drafts').length:0;return '<div class="navitem '+(folder===id?'active':'')+'" onclick="changeFolder(\''+id+'\')"><span class="ico">'+ico+'</span>'+name+(count?'<span class="count">'+count+'</span>':'')+'</div>'}).join('')}
function visible(){let q=document.getElementById('search').value.toLowerCase();return messages.filter(m=>{let inFolder=folder==='starred'?m.starred:m.folder===folder;let ok=filter==='unread'?m.unread:filter==='starred'?m.starred:true;let text=[m.from,m.email,m.subject,m.preview,m.body].join(' ').toLowerCase();return inFolder&&ok&&(!q||text.includes(q))})}
function render(){nav();let items=visible();document.getElementById('folderTitle').textContent=folders.find(f=>f[0]===folder)?.[2]||'Inbox';document.getElementById('listCount').textContent=items.length+' message'+(items.length===1?'':'s');document.getElementById('emails').innerHTML=items.length?items.map(m=>'<article class="email '+(m.unread?'unread ':'')+(selected===m.id?'selected':'')+'" onclick="openMessage('+m.id+')"><div class="emailtop"><span class="sender">'+esc(m.from)+'</span><span class="time">'+esc(m.time||'Draft')+'</span></div><div class="subject">'+esc(m.subject||'(no subject)')+'</div><div class="preview">'+esc(m.preview||m.body||'')+'</div><div class="emailmeta">'+(m.attachment?'▧ Attachment':'')+'<span class="star '+(m.starred?'on':'')+'" onclick="toggleStar(event,'+m.id+')">★</span></div></article>').join(''):'<div style="padding:35px 20px;text-align:center;color:#96a1ae">No messages here</div>'}
function changeFolder(id){folder=id;selected=null;document.getElementById('app').classList.remove('reading');render();document.getElementById('reader').innerHTML='<div class="empty"><div class="big">✉</div><strong style="color:#435267">Select a message to read</strong><p>Your inbox, in one calm place.</p></div>'}
function setFilter(f,el){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function openMessage(id){let m=messages.find(x=>x.id===id);if(!m)return;selected=id;m.unread=false;persist();document.getElementById('app').classList.add('reading');document.getElementById('reader').innerHTML='<div class="readerbar"><button class="mobileback" onclick="document.getElementById(\'app\').classList.remove(\'reading\')">←</button><button title="Back to inbox" onclick="selected=null;render()">←</button><button title="Archive" onclick="move('+id+',\'archive\')">▱</button><button title="Report spam" onclick="move('+id+',\'spam\')">⚑</button><button title="Delete" onclick="move('+id+',\'trash\')">⌫</button><span style="flex:1"></span><button title="Star" onclick="toggleStar(null,'+id+');openMessage('+id+')">★</button><button title="Reply" onclick="reply('+id+')">↶</button><button title="Forward" onclick="forward('+id+')">↪</button></div><article class="message"><h1>'+esc(m.subject||'(no subject)')+'</h1><div class="fromrow"><div class="avatar">'+esc(m.from.charAt(0).toUpperCase())+'</div><div class="fromdetails"><strong>'+esc(m.from)+'</strong><span>'+esc(m.email)+' · to '+esc(m.to||'me')+'</span></div><span class="time">'+esc(m.date||'')+' '+esc(m.time||'')+'</span></div><div class="bodycopy">'+esc(m.body||m.preview||'')+'</div>'+(m.attachment?'<div class="attachment">▧ &nbsp;'+esc(m.attachment)+' <span style="color:#8793a2;font-size:11px"> · Demo attachment</span></div>':'')+'</article>';render()}
function toggleStar(e,id){if(e)e.stopPropagation();let m=messages.find(x=>x.id===id);m.starred=!m.starred;persist();render()}
function move(id,to){let m=messages.find(x=>x.id===id);m.folder=to;selected=null;persist();changeFolder(folder);toast('Message moved to '+to)}
function openCompose(data={}){document.getElementById('composeTitle').textContent=data.title||'New message';document.getElementById('to').value=data.to||'';document.getElementById('cc').value=data.cc||'';document.getElementById('subject').value=data.subject||'';document.getElementById('body').value=data.body||'';document.getElementById('composeOverlay').classList.add('show')}
function closeCompose(){document.getElementById('composeOverlay').classList.remove('show')}
function saveDraft(){let m={id:Date.now(),folder:'drafts',from:'Carrington',email:'me',to:document.getElementById('to').value,subject:document.getElementById('subject').value,body:document.getElementById('body').value,preview:document.getElementById('body').value,unread:false,starred:false,time:'Draft'};messages.unshift(m);persist();closeCompose();changeFolder('drafts');toast('Draft saved on this device')}
function sendMessage(){let to=document.getElementById('to').value.trim();if(!to){toast('Add at least one recipient');return}let m={id:Date.now(),folder:'sent',from:'Carrington',email:'me',to,subject:document.getElementById('subject').value,body:document.getElementById('body').value,preview:document.getElementById('body').value,unread:false,starred:false,time:'Just now',date:'Today'};messages.unshift(m);persist();closeCompose();changeFolder('sent');toast('Saved to Sent — connect a mail provider to deliver it')}
function reply(id){let m=messages.find(x=>x.id===id);openCompose({title:'Reply',to:m.email,subject:'Re: '+m.subject,body:'\n\n—\n'+m.body})}
function forward(id){let m=messages.find(x=>x.id===id);openCompose({title:'Forward message',subject:'Fwd: '+m.subject,body:'\n\n---------- Forwarded message ----------\nFrom: '+m.from+' <'+m.email+'>\n\n'+m.body})}
function settings(){alert('Account settings and provider connections will be available when the Dispatch backend is configured. This prototype stores demo messages only in this browser.')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
document.getElementById('search').addEventListener('input',render);
render();
</script>
</body></html>
