<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F6CBD">
<title>Dispatch — Mail</title>
<style>
:root{font-family:"Segoe UI",SegoeUI,system-ui,-apple-system,sans-serif;color:#242424;background:#fff;font-size:14px;--blue:#0f6cbd;--action:#0078d4;--line:#e0e0e0;--subtle:#f5f5f5;--hover:#edebe9;--active:#e1dfdd;--muted:#616161}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:48px;background:#0f6cbd;color:white;display:flex;align-items:center;padding:0 14px;gap:16px}.launcher{border:0;background:transparent;color:#fff;font-size:20px;padding:5px 7px;border-radius:4px}.brand{font-size:18px;font-weight:700;white-space:nowrap}.search{height:32px;width:min(520px,48vw);margin:auto;position:relative}.search svg{position:absolute;left:10px;top:8px}.search input{height:32px;width:100%;border:1px solid #ffffff80;border-radius:4px;background:#fff;color:#242424;padding:0 12px 0 34px;outline:none}.topright{display:flex;align-items:center;gap:12px}.topicon{background:transparent;border:0;color:white;padding:6px;border-radius:4px;font-size:18px}.topicon:hover,.launcher:hover{background:#ffffff22}.profile{width:30px;height:30px;border-radius:50%;background:#f8f9fa;color:#174a75;border:1px solid #d6e6f5;font-weight:600}.workspace{height:calc(100vh - 48px);display:grid;grid-template-columns:48px 220px 350px minmax(320px,1fr);min-width:0}.rail{background:#f5f5f5;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:8px}.railbtn{height:40px;width:40px;border:0;background:transparent;color:#424242;border-radius:4px;position:relative;font-size:19px}.railbtn:hover{background:var(--hover)}.railbtn.active{color:var(--blue);background:#e8f2fb}.railbtn.active:before{content:"";position:absolute;left:-4px;top:8px;height:24px;width:3px;background:var(--blue);border-radius:2px}.folders{background:#f5f5f5;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}.newbtn{width:100%;height:36px;background:#0078d4;border:0;color:white;border-radius:4px;font-weight:600;text-align:left;padding:0 13px;margin-bottom:18px}.newbtn:hover{background:#106ebe}.section{margin:8px 0}.sectionhead{height:32px;width:100%;display:flex;align-items:center;gap:8px;padding:0 8px;border:0;background:transparent;text-align:left;font-weight:600;color:#424242}.folder{height:34px;display:flex;align-items:center;gap:11px;padding:0 10px;margin:2px 0;border-radius:3px;color:#333;cursor:pointer;position:relative}.folder:hover{background:#edebe9}.folder.active{background:#e1dfdd;font-weight:600}.folder.active:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:#0078d4}.folder .ficon{width:17px;text-align:center;color:#505050}.count{margin-left:auto;font-size:12px;color:#424242}.list{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:white}.listhead{padding:18px 16px 10px}.listtitle{font-size:20px;font-weight:600;margin:0 0 13px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:0 2px 9px;color:#616161}.tab.active{font-weight:600;color:#242424;border-bottom:2px solid #0f6cbd}.mailitems{overflow:auto;flex:1}.mail{padding:12px 12px 11px 15px;min-height:108px;border-bottom:1px solid #edebe9;position:relative;cursor:pointer;border-left:3px solid transparent}.mail:hover{background:#f8f8f8}.mail.selected{background:#f3f8fc}.mail.unread{border-left-color:#0078d4}.mailtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}.senderavatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e8e8e8;color:#424242;font-weight:600}.sender{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.unread .sender,.unread .subject{font-weight:700}.timestamp{font-size:11px;color:#616161;white-space:nowrap}.subject{font-weight:400;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{color:#616161;font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-left:38px}.quick{position:absolute;right:8px;top:9px;display:none;gap:3px;background:#f8f8f8}.mail:hover .quick{display:flex}.quick button{border:0;background:transparent;border-radius:3px;padding:4px;color:#424242}.quick button:hover{background:#e1dfdd}.reader{min-width:0;display:flex;flex-direction:column;background:white}.toolbar{height:44px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:3px;overflow-x:auto}.tool{height:32px;border:0;background:transparent;border-radius:3px;color:#424242;padding:0 9px;white-space:nowrap;display:flex;align-items:center;gap:7px}.tool:hover{background:#f0f0f0}.tool .sym{font-size:16px}.message{overflow:auto;padding:25px 32px 40px;max-width:1000px;width:100%}.subjectline{font-size:20px;font-weight:600;color:#242424;margin:0 0 22px}.sendercard{display:flex;align-items:center;gap:12px;margin-bottom:24px}.bigavatar{width:42px;height:42px;border-radius:50%;background:#e8e8e8;display:grid;place-items:center;font-weight:600;font-size:16px}.senderinfo{min-width:0;flex:1}.senderinfo strong{display:block;font-weight:600}.senderinfo .emailmeta{color:#616161;font-size:12px;margin-top:3px}.received{color:#616161;font-size:12px;white-space:nowrap}.body{font-size:14px;line-height:1.65;color:#242424;white-space:pre-wrap;max-width:780px}.attachment{margin-top:24px;border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:inline-flex;gap:10px;align-items:center;background:#fafafa}.empty{margin:auto;text-align:center;color:#616161}.empty .symbol{font-size:40px;color:#8a8886;margin-bottom:12px}.empty strong{color:#424242}.composeveil{display:none;position:fixed;inset:0;background:#0005;z-index:5;align-items:center;justify-content:center;padding:16px}.composeveil.show{display:flex}.composebox{width:min(650px,100%);background:#fff;box-shadow:0 8px 32px #0003;border-radius:6px;overflow:hidden}.composehead{height:44px;background:#f5f5f5;padding:0 15px;display:flex;align-items:center;justify-content:space-between;font-weight:600}.composehead button{border:0;background:transparent;font-size:20px}.composefields{padding:8px 18px}.composefields input,.composefields textarea{display:block;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);outline:none}.composefields textarea{height:230px;resize:vertical;border:0}.composefoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px}.send{background:#0078d4;color:white;border:0;border-radius:4px;padding:8px 20px;font-weight:600}.secondary{background:white;border:1px solid var(--line);border-radius:4px;padding:8px 13px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#242424;color:white;padding:10px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:.2s;z-index:9}.toast.show{opacity:1}
@media(max-width:1050px){.workspace{grid-template-columns:48px 190px 320px minmax(280px,1fr)}.tool{padding:0 7px}.tool .label{display:none}}
@media(max-width:760px){body{overflow:hidden}.top{gap:8px;padding:0 8px}.brand{font-size:16px}.search{width:auto;flex:1}.topright{gap:3px}.workspace{grid-template-columns:44px minmax(0,1fr);position:relative}.rail{grid-column:1;grid-row:1}.folders{display:none}.list{grid-column:2;grid-row:1}.reader{display:none;position:absolute;inset:0 0 0 44px;z-index:2}.workspace.reading .list{display:none}.workspace.reading .reader{display:flex}.message{padding:20px 16px}.toolbar{padding:0 6px}.tool{padding:0 8px}.received{display:none}}
@media(min-width:761px) and (max-width:900px){.workspace{grid-template-columns:44px 180px 290px minmax(260px,1fr)}}
</style>
</head>
<body>
<header class="top"><button class="launcher" title="App launcher" aria-label="App launcher">▦</button><div class="brand">Dispatch</div><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#616161" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="Search state dispatches and mail..." aria-label="Search state dispatches and mail"></div><div class="topright"><button class="topicon" title="Settings" onclick="toast('Settings will be available in your Dispatch account')">⚙</button><button class="topicon" title="Notifications" onclick="toast('You’re all caught up')">♧</button><button class="profile" title="Profile">C</button></div></header>
<div class="workspace" id="workspace">
<nav class="rail" aria-label="Applications"><button class="railbtn active" title="Mail">✉</button><button class="railbtn" title="Calendar" onclick="toast('Calendar is coming to Dispatch')">▦</button><button class="railbtn" title="People" onclick="toast('People is coming to Dispatch')">♙</button><button class="railbtn" title="Tasks" onclick="toast('Tasks is coming to Dispatch')">✓</button></nav>
<aside class="folders"><button class="newbtn" onclick="compose()">＋ &nbsp; New Dispatch</button><div class="section"><button class="sectionhead" onclick="toggleSection('favorites')"><span id="favoritesArrow">⌄</span> Favorites</button><div id="favorites"><div class="folder" onclick="changeFolder('starred')"><span class="ficon">☆</span>Starred</div><div class="folder" onclick="changeFolder('inbox')"><span class="ficon">▣</span>Inbox</div></div></div><div class="section"><button class="sectionhead" onclick="toggleSection('folders')"><span id="foldersArrow">⌄</span> Folders</button><div id="folders"><div class="folder active" data-folder="inbox" onclick="changeFolder('inbox')"><span class="ficon">▣</span>Inbox<span class="count" id="unreadCount">2</span></div><div class="folder" data-folder="sent" onclick="changeFolder('sent')"><span class="ficon">↗</span>Sent Items</div><div class="folder" data-folder="drafts" onclick="changeFolder('drafts')"><span class="ficon">▤</span>Drafts<span class="count" id="draftCount"></span></div><div class="folder" data-folder="archive" onclick="changeFolder('archive')"><span class="ficon">▱</span>Archive</div><div class="folder" data-folder="spam" onclick="changeFolder('spam')"><span class="ficon">⚑</span>Junk</div><div class="folder" data-folder="trash" onclick="changeFolder('trash')"><span class="ficon">⌫</span>Trash</div></div></div></aside>
<section class="list"><div class="listhead"><h1 class="listtitle" id="folderTitle">Inbox</h1><div class="tabs"><button class="tab active" onclick="setTab('focused',this)">Focused</button><button class="tab" onclick="setTab('other',this)">Other</button></div></div><div class="mailitems" id="mailitems"></div></section>
<main class="reader" id="reader"><div class="toolbar" id="toolbar" style="display:none"></div><div class="empty" id="empty"><div class="symbol">✉</div><strong>Select an item to read</strong><p>Your messages will appear here.</p></div><article class="message" id="message" style="display:none"></article></main>
</div>
<div class="composeveil" id="composeveil"><div class="composebox"><div class="composehead"><span>New Dispatch</span><button onclick="closeCompose()" aria-label="Close">×</button></div><div class="composefields"><input id="to" placeholder="To"><input id="subject" placeholder="Subject"><textarea id="body" placeholder="Write your dispatch..."></textarea></div><div class="composefoot"><button class="send" onclick="sendMessage()">Send</button><button class="secondary" onclick="saveDraft()">Save draft</button><button class="secondary" onclick="closeCompose()">Discard</button></div></div></div><div class="toast" id="toast"></div>
<script>
const seed=[
{id:1,folder:'inbox',from:'Maya Chen',email:'maya@dispatch.com',to:'Carrington',subject:'The proposal looks fantastic',preview:'I reviewed the latest version this morning. The direction feels right, and I have just a couple of small notes for us to discuss.',body:'Hi Carrington,\n\nI reviewed the latest version this morning. The direction feels right, and I have just a couple of small notes for us to discuss.\n\nCould we find 20 minutes tomorrow to walk through the timeline? I think we are very close.\n\nBest,\nMaya',time:'10:42 AM',date:'Today',unread:true,starred:true},
{id:2,folder:'inbox',from:'Jordan Lee',email:'jordan@dispatch.com',to:'Carrington',subject:'A few ideas for next week',preview:'Collected a few references and thoughts from the team. Sharing them here before our planning session.',body:'Hey,\n\nCollected a few references and thoughts from the team. Sharing them here before our planning session.\n\nI especially like the idea of keeping the first launch focused and letting the product grow from real feedback.\n\nTalk soon,\nJordan',time:'9:18 AM',date:'Today',unread:true,starred:false},
{id:3,folder:'inbox',from:'Dispatch Team',email:'team@dispatch.com',to:'Carrington',subject:'Welcome to your Dispatch workspace',preview:'Your Dispatch workspace is ready. Here are a few ways to make it your own.',body:'Welcome to Dispatch!\n\nYour workspace is ready. Use folders to stay organized, star important conversations, and create a new dispatch whenever you need to reach someone.\n\nThis is a front-end prototype. Messages are sample data stored in this browser; Dispatch-to-Dispatch delivery requires the backend.',time:'Yesterday',date:'Yesterday',unread:false,starred:false},
{id:4,folder:'inbox',from:'Alex Morgan',email:'alex@dispatch.com',to:'Carrington',subject:'Re: Brand exploration',preview:'Thanks for sending these over — option B is my favorite. The contrast is really strong and feels timeless.',body:'Thanks for sending these over — option B is my favorite. The contrast is really strong and feels timeless. Let’s use that as our starting point.\n\nAlex',time:'Yesterday',date:'Yesterday',unread:false,starred:true},
{id:5,folder:'inbox',from:'Sam Rivera',email:'sam@dispatch.com',to:'Carrington',subject:'Coffee next Thursday?',preview:'I will be in your area and would love to catch up if you have a little time.',body:'I will be in your area and would love to catch up if you have a little time. Let me know what your schedule looks like!\n\nSam',time:'Mon',date:'Monday',unread:false,starred:false},
{id:6,folder:'inbox',from:'Taylor Brooks',email:'taylor@dispatch.com',to:'Carrington',subject:'Updated files attached',preview:'Here are the updated exports in the formats we discussed. Let me know if anything else is needed.',body:'Here are the updated exports in the formats we discussed. Let me know if anything else is needed.\n\nTaylor',time:'Mon',date:'Monday',unread:false,starred:false}
];
let messages=JSON.parse(localStorage.getItem('dispatch.messages')||'null')||seed,folder='inbox',selected=null,tab='focused';
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('dispatch.messages',JSON.stringify(messages))}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function visible(){let q=$('search').value.toLowerCase();return messages.filter(m=>(folder==='starred'?m.starred:m.folder===folder)&&(!q||[m.from,m.email,m.subject,m.preview,m.body].join(' ').toLowerCase().includes(q)))}
function render(){let unread=messages.filter(m=>m.folder==='inbox'&&m.unread).length;$('unreadCount').textContent=unread||'';$('draftCount').textContent=messages.filter(m=>m.folder==='drafts').length||'';$('folderTitle').textContent=({inbox:'Inbox',starred:'Favorites',sent:'Sent Items',drafts:'Drafts',archive:'Archive',spam:'Junk',trash:'Trash'})[folder];document.querySelectorAll('.folder[data-folder]').forEach(el=>el.classList.toggle('active',el.dataset.folder===folder));let items=visible();$('mailitems').innerHTML=items.length?items.map(m=>'<article class="mail '+(m.unread?'unread ':'')+(m.id===selected?'selected':'')+'" onclick="openMessage('+m.id+')"><div class="mailtop"><div class="senderavatar">'+esc(m.from.charAt(0).toUpperCase())+'</div><div class="sender">'+esc(m.from)+'</div><time class="timestamp">'+esc(m.time||'Draft')+'</time></div><div class="subject">'+esc(m.subject||'(no subject)')+'</div><div class="preview">'+esc(m.preview||m.body||'')+'</div><div class="quick"><button title="Delete" onclick="event.stopPropagation();move('+m.id+',\'trash\')">⌫</button><button title="Archive" onclick="event.stopPropagation();move('+m.id+',\'archive\')">▱</button><button title="Flag" onclick="event.stopPropagation();star('+m.id+')">⚑</button></div></article>').join(''):'<div style="padding:36px 18px;text-align:center;color:#616161">No messages</div>';if(selected&&!messages.some(m=>m.id===selected))clearReader()}
function changeFolder(f){folder=f;selected=null;clearReader();render();if(innerWidth<=760)$('workspace').classList.remove('reading')}
function setTab(t,el){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');toast(t==='focused'?'Showing Focused messages':'Showing Other messages')}
function toggleSection(id){let el=$(id),hidden=el.style.display==='none';el.style.display=hidden?'block':'none';$(id+'Arrow').textContent=hidden?'⌄':'›'}
function clearReader(){$('toolbar').style.display='none';$('message').style.display='none';$('empty').style.display='block'}
function openMessage(id){let m=messages.find(x=>x.id===id);if(!m)return;selected=id;m.unread=false;save();$('workspace').classList.add('reading');$('empty').style.display='none';$('toolbar').style.display='flex';$('message').style.display='block';$('toolbar').innerHTML='<button class="tool" onclick="reply('+id+')"><span class="sym">↶</span><span class="label">Reply</span></button><button class="tool" onclick="reply('+id+')"><span class="sym">↶</span><span class="label">Reply All</span></button><button class="tool" onclick="forward('+id+')"><span class="sym">↪</span><span class="label">Forward</span></button><button class="tool" onclick="move('+id+',\'trash\')"><span class="sym">⌫</span><span class="label">Delete</span></button><button class="tool" onclick="move('+id+',\'archive\')"><span class="sym">▱</span><span class="label">Archive</span></button><button class="tool" onclick="markUnread('+id+')"><span class="sym">✉</span><span class="label">Mark as Unread</span></button>';$('message').innerHTML='<h1 class="subjectline">'+esc(m.subject||'(no subject)')+'</h1><div class="sendercard"><div class="bigavatar">'+esc(m.from.charAt(0).toUpperCase())+'</div><div class="senderinfo"><strong>'+esc(m.from)+'</strong><div class="emailmeta">'+esc(m.email)+' · To: '+esc(m.to||'you')+'</div></div><div class="received">'+esc(m.date||'')+' '+esc(m.time||'')+'</div></div><div class="body">'+esc(m.body||m.preview||'')+'</div>';render()}
function markUnread(id){let m=messages.find(x=>x.id===id);m.unread=true;save();selected=null;clearReader();render();toast('Marked as unread')}
function star(id){let m=messages.find(x=>x.id===id);m.starred=!m.starred;save();render()}
function move(id,to){let m=messages.find(x=>x.id===id);m.folder=to;selected=null;clearReader();save();render();toast('Moved to '+({trash:'Trash',archive:'Archive',spam:'Junk'}[to]||to))}
function compose(data={}){$('to').value=data.to||'';$('subject').value=data.subject||'';$('body').value=data.body||'';$('composeveil').classList.add('show')}
function closeCompose(){$('composeveil').classList.remove('show')}
function saveDraft(){messages.unshift({id:Date.now(),folder:'drafts',from:'You',email:'me@dispatch.com',to:$('to').value,subject:$('subject').value,body:$('body').value,preview:$('body').value,unread:false,time:'Draft'});save();closeCompose();changeFolder('drafts');toast('Draft saved on this device')}
function sendMessage(){if(!$('to').value.trim()){toast('Add a recipient first');return}messages.unshift({id:Date.now(),folder:'sent',from:'You',email:'me@dispatch.com',to:$('to').value,subject:$('subject').value,body:$('body').value,preview:$('body').value,unread:false,time:'Just now',date:'Today'});save();closeCompose();changeFolder('sent');toast('Saved to Sent — Dispatch delivery is not connected yet')}
function reply(id){let m=messages.find(x=>x.id===id);compose({to:m.email,subject:'Re: '+m.subject,body:'\n\n—\n'+m.body})}
function forward(id){let m=messages.find(x=>x.id===id);compose({subject:'Fwd: '+m.subject,body:'\n\n---------- Forwarded message ----------\nFrom: '+m.from+' <'+m.email+'>\n\n'+m.body})}
$('search').addEventListener('input',render);render();
</script></body></html>
